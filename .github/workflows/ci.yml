name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer, phpcs, phpunit:9

      - name: PHP syntax lint (all files)
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 -P4 php -l

      - name: Magento 2 coding standard
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require magento/magento-coding-standard --no-interaction
          "$(composer global config home)/vendor/bin/phpcs" --standard=Magento2 -n \
            --extensions=php,phtml --ignore='*/vendor/*,*/Test/bootstrap.php' .

      # Real gate: the pure-logic unit tests run without a Magento install (see
      # Test/bootstrap.php), so a failing test breaks the build.
      - name: PHP unit tests
        run: phpunit -c phpunit.xml.dist
